[project]
name = "coda-bot"
version = "0.1.0"
description = "Discord bot for Arcaea score lookup"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hout-Manut" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.13.5",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "colorlog>=6.10.1",
    "cryptography>=49.0.0",
    "fastapi>=0.136.3",
    "fonttools>=4.63.0",
    "hikari>=2.5.0",
    "hikari-lightbulb>=3",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.47.0",
]

[project.scripts]
coda = "coda.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coda"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
